<section class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
  <article class="rounded-md border border-slate-200 bg-slate-50 p-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Total</p>
    <p class="mt-2 text-2xl font-bold text-slate-950">{{ total() }}</p>
  </article>

  <article class="rounded-md border border-amber-200 bg-amber-50 p-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-amber-700">Pendientes</p>
    <p class="mt-2 text-2xl font-bold text-amber-700">{{ pending() }}</p>
  </article>

  <article class="rounded-md border border-emerald-200 bg-emerald-50 p-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-emerald-700">Completadas</p>
    <p class="mt-2 text-2xl font-bold text-emerald-700">{{ completed() }}</p>
  </article>

  <article class="rounded-md border border-teal-200 bg-teal-50 p-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-teal-700">Progreso</p>
    <p class="mt-2 text-2xl font-bold text-teal-700">{{ progressPercentage() }}%</p>
  </article>
</section>
