<form class="mt-6 flex flex-col gap-3 sm:flex-row" (ngSubmit)="submitTodo()">
  <input
    class="min-h-12 min-w-0 flex-1 rounded-md border border-slate-300 bg-white px-4 text-sm font-medium text-slate-950 shadow-sm outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100"
    type="text"
    name="title"
    placeholder="Escribí una nueva tarea"
    [(ngModel)]="title"
  />

  <button
    class="min-h-12 rounded-md bg-emerald-700 px-6 text-sm font-bold text-white shadow-sm transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-100"
    type="submit"
  >
    Agregar
  </button>
</form>
