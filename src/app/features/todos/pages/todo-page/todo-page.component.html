<main
  class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(34,197,94,0.28),_transparent_34%),linear-gradient(135deg,_#022c22_0%,_#064e3b_52%,_#0f766e_100%)] px-4 py-6 font-sans antialiased sm:px-6 sm:py-10"
>
  <section class="mx-auto flex min-h-[calc(100vh-3rem)] max-w-4xl items-center">
    <div
      class="w-full rounded-lg border border-white/70 bg-slate-50 p-5 shadow-2xl shadow-slate-950/25 sm:p-7 lg:p-9"
    >
      <header class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-emerald-700">
            Programación V
          </p>
          <h1 class="mt-2 text-3xl font-bold leading-tight text-slate-950 sm:text-4xl">
            Lista de Tareas
          </h1>
          <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600 sm:text-base">
            Organizá pendientes, marcá avances y limpiá la lista cuando termines.
          </p>
        </div>

        <div class="w-full rounded-md border border-emerald-100 bg-white p-4 shadow-sm md:max-w-64">
          <div class="flex items-center justify-between gap-4">
            <span class="text-sm font-semibold text-slate-600">Progreso</span>
            <span class="text-xl font-bold text-emerald-700">
              {{ totalTodos() === 0 ? 0 : (completedTodos() / totalTodos() * 100).toFixed(0) }}%
            </span>
          </div>
          <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-200">
            <div
              class="h-full rounded-full bg-emerald-600 transition-all duration-300"
              [style.width.%]="totalTodos() === 0 ? 0 : (completedTodos() / totalTodos() * 100).toFixed(0)"
            ></div>
          </div>
        </div>
      </header>

      <div class="mt-6">
        <app-todo-stats
          [total]="totalTodos()"
          [pending]="pendingTodos()"
          [completed]="completedTodos()"
        />

        <app-todo-form (todoCreated)="addTodo($event)" />

        <app-todo-list
          [todos]="todos()"
          (todoToggled)="toggleTodo($event)"
          (todoDeleted)="deleteTodo($event)"
        />

        <div
          class="mt-6 flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-center"
        >
          <button
            class="min-h-12 rounded-md border border-slate-300 bg-white px-5 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-slate-200 disabled:cursor-not-allowed disabled:opacity-50"
            type="button"
            [disabled]="completedTodos() === 0"
            (click)="clearCompleted()"
          >
            Limpiar completadas
          </button>

          <button
            class="min-h-12 rounded-md border border-red-200 bg-red-50 px-5 text-sm font-bold text-red-700 shadow-sm transition hover:bg-red-100 focus:outline-none focus:ring-4 focus:ring-red-100 disabled:cursor-not-allowed disabled:opacity-50"
            type="button"
            [disabled]="totalTodos() === 0"
            (click)="clearAll()"
          >
            Limpiar todo
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
